services:
  postgres:
    image: postgres:16-alpine
    container_name: analysishub_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analysishub}
      POSTGRES_USER: ${POSTGRES_USER:-forensic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensic_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensic}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: analysishub_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Tor SOCKS5 proxy — used ONLY by the dark-web crawler to reach .onion / dark
  # sources without exposing the real source IP. Reachable inside the compose
  # network as tor:9050; also bound to 127.0.0.1:9050 so a locally-run backend
  # can use it too. NOT exposed externally.
  tor:
    image: dperson/torproxy
    container_name: analysishub_tor
    ports:
      - "127.0.0.1:9050:9050"
    restart: unless-stopped

  # Cloudflare Tunnel — fronts the OSINT canary links so the real server IP is
  # NEVER exposed to whoever clicks them. cloudflared dials OUT to Cloudflare (no
  # inbound port opened on your host); Cloudflare serves your public hostname and
  # forwards requests to the backend over the tunnel.
  #
  # One-time setup (Cloudflare Zero Trust dashboard):
  #   1. Networks → Tunnels → Create a tunnel (Cloudflared) → copy the token.
  #   2. .env:  CLOUDFLARE_TUNNEL_TOKEN=<token>
  #   3. Add a Public Hostname to the tunnel, e.g. canary.yourdomain.com,
  #      Service = HTTP → backend:8080. (Recommended: restrict Path to /c/* so
  #      only the canary endpoint is reachable on that domain.)
  #   4. .env:  CANARY_BASE_URL=https://canary.yourdomain.com
  #
  # Opt-in: only starts with the "tunnel" profile so a normal `docker compose up`
  # is unaffected when no token is configured:
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: analysishub_cloudflared
    profiles: [ "tunnel" ]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: analysishub_backend
    user: root
    # Publish the backend on a host port so canary links (/c/<slug>) are reachable
    # directly at CANARY_BASE_URL (http://<host>:43888). Container listens on 8080.
    ports:
      - "${CANARY_PORT:-43888}:8080"
      # OOB interaction server ("Catch"). Uncomment when OOB_ENABLED=true and the
      # OOB_DOMAIN's NS records are delegated to this host. These bind privileged
      # host ports (53/udp+tcp, 80, 25) that often clash with systemd-resolved /
      # a web server — free them first. HTTPS (443) only if OOB_TLS_CERT is set.
      # - "53:53/udp"
      # - "53:53/tcp"
      # - "80:80"
      # - "25:25"
      # - "443:443"
      # - "1389:1389"   # JNDI/LDAP catcher (Log4Shell)
      # - "1099:1099"   # JNDI/RMI catcher
    # Pull every key/setting from .env (VirusTotal, Shodan, abuse.ch, proxy, …)
    # into the container. Explicit `environment:` entries below still win for the
    # container-internal values (DB/Redis hostnames, Tor service name).
    # Optional: a fresh clone has no .env (it's gitignored). required:false lets
    # `docker compose up` still boot using the ${VAR:-default} fallbacks in the
    # environment block below. Copy .env.example → .env to supply real secrets /
    # API keys (see README).
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-development}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - POSTGRES_DSN=postgres://${POSTGRES_USER:-forensic}:${POSTGRES_PASSWORD:-forensic_secret}@postgres:5432/${POSTGRES_DB:-analysishub}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - JWT_SECRET=${JWT_SECRET:-change_this_jwt_secret_in_production}
      - STORAGE_PATH=/app/storage
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@analysishub.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Public base URL for canary links — set to your Cloudflare Tunnel hostname
      # so generated links front through the tunnel instead of the real host.
      - CANARY_BASE_URL=${CANARY_BASE_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - USE_HTTPS=${USE_HTTPS:-false}
      - LOG_PATH=/app/data/logs
      # Dark-web crawler dials the in-stack Tor service (overrides any .env value,
      # which uses 127.0.0.1 for local runs). General API traffic does NOT use Tor.
      - OSINT_TOR_PROXY=socks5://tor:9050
      # Vulnerability scanner (httpx + nuclei over OSINT-discovered assets).
      # Scanner traffic is forced through the configured proxy; with VULNSCAN_PROXY
      # empty it falls back to OSINT_TOR_PROXY (Tor) above. Templates are baked at
      # /app/nuclei-templates by the backend image build.
      - VULNSCAN_ENABLED=${VULNSCAN_ENABLED:-true}
      - VULNSCAN_PROXY=${VULNSCAN_PROXY:-}
      - VULNSCAN_NUCLEI_TEMPLATES=${VULNSCAN_NUCLEI_TEMPLATES:-/app/nuclei-templates}
      # Internal address of the volatility/kali ttyd terminal the backend
      # reverse-proxies (admin-gated). Not published on the host.
      - SANDBOX_TERMINAL_URL=${SANDBOX_TERMINAL_URL:-http://volatility_sandbox:7681}
      # OOB interaction server ("Catch"). Disabled unless OOB_ENABLED=true AND the
      # OOB_DOMAIN zone is delegated to OOB_PUBLIC_IP. See .env.example for setup.
      - OOB_ENABLED=${OOB_ENABLED:-false}
      - OOB_DOMAIN=${OOB_DOMAIN:-}
      - OOB_PUBLIC_IP=${OOB_PUBLIC_IP:-}
      - OOB_PUBLIC_IPV6=${OOB_PUBLIC_IPV6:-}
      - OOB_NS_NAME=${OOB_NS_NAME:-}
      - OOB_TLS_CERT=${OOB_TLS_CERT:-}
      - OOB_TLS_KEY=${OOB_TLS_KEY:-}
    volumes:
      - storage_data:/app/storage
      - ./backend/data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tor:
        condition: service_started
    restart: unless-stopped

  # Volatility + Kali offensive sandbox. The ttyd web terminal is intentionally
  # NOT published on the host — the backend reverse-proxies to it on the internal
  # network (volatility_sandbox:7681) behind an admin JWT, so there is no
  # unauthenticated shell exposed. Tool egress is routed through the `tor`
  # service (see the Dockerfile) to avoid leaking the host IP during scans.
  volatility_sandbox:
    build:
      context: ./volatility
      dockerfile: Dockerfile
    container_name: analysishub_volatility
    # No host port mapping — reachable only via the backend sandbox proxy.
    expose:
      - "7681"
    volumes:
      - storage_data:/app/storage
    # privileged dropped — volatility only reads dump files. If raw-packet
    # tooling is ever needed locally, add `cap_add: [NET_RAW, NET_ADMIN]`
    # instead of full privilege (Tor scans use connect scans, no raw caps).
    depends_on:
      tor:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: analysishub_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
