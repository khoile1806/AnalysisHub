services:
  postgres:
    image: postgres:16-alpine
    container_name: analysishub_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analysishub}
      POSTGRES_USER: ${POSTGRES_USER:-forensic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensic_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensic}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: analysishub_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Elasticsearch — the searchable store for the Log Search module. Uploaded
  # logs (evtx/access/firewall/syslog/json/csv) are parsed to ECS and bulk-indexed
  # here, then searched from the "SIEM Threat Hunting" page via a built-in ELK
  # profile pointed at http://elasticsearch:9200. Security is disabled (single-node
  # analyst box on an internal network); it is NOT published on the host by default.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${LOGSEARCH_ES_VERSION:-8.17.3}
    container_name: analysishub_elasticsearch
    # Runs on `docker compose up`. An admin can STOP it (with Kibana) from the Log
    # Ingest tab to free RAM when not hunting, and Start it again later.
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms${LOGSEARCH_ES_MEM:-2g} -Xmx${LOGSEARCH_ES_MEM:-2g}
    # Cap total container memory (heap + off-heap/Lucene) so a spike can't starve
    # the rest of the stack. Keep this comfortably above ES_JAVA_OPTS heap.
    mem_limit: ${LOGSEARCH_ES_MEM_LIMIT:-3g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    # Uncomment to reach Elasticsearch directly from the host for debugging:
    # ports:
    #   - "${LOGSEARCH_ES_PORT:-9200}:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Kibana — full ELK UI for viewing/searching the ingested logs and building
  # detection rules/alerts, dashboards and visualizations like a normal ELK
  # stack. Served under the /kbn base path through the frontend's nginx (same
  # origin as the app) so it is centralised at http://<host>:FRONTEND_PORT/kbn
  # and can be embedded as an in-app "Kibana" page — no extra host port needed.
  # The version MUST match Elasticsearch.
  kibana:
    image: docker.elastic.co/kibana/kibana:${LOGSEARCH_ES_VERSION:-8.17.3}
    container_name: analysishub_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_BASEPATH=/kbn
      - SERVER_REWRITEBASEPATH=true
      - SERVER_PUBLICBASEURL=${KIBANA_PUBLIC_URL:-http://localhost:3000/kbn}
      - TELEMETRY_ENABLED=false
      # Encryption keys (each >= 32 chars) — REQUIRED for Alerting rules, Actions/
      # Connectors and Reporting to work; without the saved-objects key Kibana
      # throws "Encrypted Saved Objects plugin is missing encryption key". Override
      # in .env for production; keeping them stable preserves existing encrypted
      # objects across restarts.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ESO_ENCRYPTIONKEY:-analysishub_kibana_encrypted_saved_objects_key_0}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SECURITY_ENCRYPTIONKEY:-analysishub_kibana_security_session_key_000000000}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_ENCRYPTIONKEY:-analysishub_kibana_reporting_encryption_key_00000}
    mem_limit: ${KIBANA_MEM_LIMIT:-1500m}
    expose:
      - "5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:5601/kbn/api/status || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # Docker socket proxy — a least-privilege gateway that lets the backend START/
  # STOP the ELK containers (the "Hệ thống ELK" toggle) WITHOUT giving it the raw
  # host socket. Only the container API + write (POST) methods are allowed; images,
  # volumes, networks, exec and host info stay denied. The real socket is mounted
  # read-only here and NEVER into the backend. Not published on the host.
  docker_socket_proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: analysishub_docker_proxy
    environment:
      - CONTAINERS=1   # allow /containers (inspect + start/stop)
      - POST=1         # allow write methods (start/stop are POST)
      # everything else stays 0 (denied): IMAGES, VOLUMES, NETWORKS, EXEC, INFO…
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    restart: unless-stopped

  # Tor SOCKS5 proxy — used ONLY by the dark-web crawler to reach .onion / dark
  # sources without exposing the real source IP. Reachable inside the compose
  # network as tor:9050; also bound to 127.0.0.1:9050 so a locally-run backend
  # can use it too. NOT exposed externally.
  tor:
    image: dperson/torproxy
    container_name: analysishub_tor
    ports:
      - "127.0.0.1:9050:9050"
    restart: unless-stopped

  # Cloudflare Tunnel — fronts the OSINT canary links so the real server IP is
  # NEVER exposed to whoever clicks them. cloudflared dials OUT to Cloudflare (no
  # inbound port opened on your host); Cloudflare serves your public hostname and
  # forwards requests to the backend over the tunnel.
  #
  # One-time setup (Cloudflare Zero Trust dashboard):
  #   1. Networks → Tunnels → Create a tunnel (Cloudflared) → copy the token.
  #   2. .env:  CLOUDFLARE_TUNNEL_TOKEN=<token>
  #   3. Add a Public Hostname to the tunnel, e.g. canary.yourdomain.com,
  #      Service = HTTP → backend:8080. (Recommended: restrict Path to /c/* so
  #      only the canary endpoint is reachable on that domain.)
  #   4. .env:  CANARY_BASE_URL=https://canary.yourdomain.com
  #
  # Opt-in: only starts with the "tunnel" profile so a normal `docker compose up`
  # is unaffected when no token is configured:
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: analysishub_cloudflared
    profiles: [ "tunnel" ]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: analysishub_backend
    user: root
    # Publish the backend on a host port so canary links (/c/<slug>) are reachable
    # directly at CANARY_BASE_URL (http://<host>:43888). Container listens on 8080.
    ports:
      - "${CANARY_PORT:-43888}:8080"
      # OOB interaction server ("Catch"). Uncomment when OOB_ENABLED=true and the
      # OOB_DOMAIN's NS records are delegated to this host. These bind privileged
      # host ports (53/udp+tcp, 80, 25) that often clash with systemd-resolved /
      # a web server — free them first. HTTPS (443) only if OOB_TLS_CERT is set.
      # - "53:53/udp"
      # - "53:53/tcp"
      # - "80:80"
      # - "25:25"
      # - "443:443"
      # - "1389:1389"   # JNDI/LDAP catcher (Log4Shell)
      # - "1099:1099"   # JNDI/RMI catcher
    # Pull every key/setting from .env (VirusTotal, Shodan, abuse.ch, proxy, …)
    # into the container. Explicit `environment:` entries below still win for the
    # container-internal values (DB/Redis hostnames, Tor service name).
    # Optional: a fresh clone has no .env (it's gitignored). required:false lets
    # `docker compose up` still boot using the ${VAR:-default} fallbacks in the
    # environment block below. Copy .env.example → .env to supply real secrets /
    # API keys (see README).
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-development}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - POSTGRES_DSN=postgres://${POSTGRES_USER:-forensic}:${POSTGRES_PASSWORD:-forensic_secret}@postgres:5432/${POSTGRES_DB:-analysishub}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - JWT_SECRET=${JWT_SECRET:-change_this_jwt_secret_in_production}
      - STORAGE_PATH=/app/storage
      # Local malware dynamic analysis via the emulator sidecar (no CAPE/VM). Points
      # at the internal service; the feature self-disables if the service is down.
      - MALWARE_EMULATOR_URL=${MALWARE_EMULATOR_URL:-http://malware_emulator:8091}
      # Network-traffic (pcap) analysis sidecar — Suricata offline mode.
      - NET_ANALYZER_URL=${NET_ANALYZER_URL:-http://net_analyzer:8092}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@analysishub.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Public base URL for canary links — set to your Cloudflare Tunnel hostname
      # so generated links front through the tunnel instead of the real host.
      - CANARY_BASE_URL=${CANARY_BASE_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - USE_HTTPS=${USE_HTTPS:-false}
      - LOG_PATH=/app/data/logs
      # Dark-web crawler dials the in-stack Tor service (overrides any .env value,
      # which uses 127.0.0.1 for local runs). General API traffic does NOT use Tor.
      - OSINT_TOR_PROXY=socks5://tor:9050
      # Vulnerability scanner (httpx + nuclei over OSINT-discovered assets).
      # Scanner traffic is forced through the configured proxy; with VULNSCAN_PROXY
      # empty it falls back to OSINT_TOR_PROXY (Tor) above. Templates are baked at
      # /app/nuclei-templates by the backend image build.
      - VULNSCAN_ENABLED=${VULNSCAN_ENABLED:-true}
      - VULNSCAN_PROXY=${VULNSCAN_PROXY:-}
      - VULNSCAN_NUCLEI_TEMPLATES=${VULNSCAN_NUCLEI_TEMPLATES:-/app/nuclei-templates}
      # Internal address of the volatility/kali ttyd terminal the backend
      # reverse-proxies (admin-gated). Not published on the host.
      - SANDBOX_TERMINAL_URL=${SANDBOX_TERMINAL_URL:-http://volatility_sandbox:7681}
      # Log Search module: the built-in Elasticsearch the backend bulk-indexes
      # uploaded logs into and auto-registers as an ELK hunting profile.
      - LOGSEARCH_ES_URL=${LOGSEARCH_ES_URL:-http://elasticsearch:9200}
      # Internal Kibana URL (includes the /kbn base path) — the backend creates
      # the hunt-* data view here on startup so the logs are immediately viewable.
      - LOGSEARCH_KIBANA_URL=${LOGSEARCH_KIBANA_URL:-http://kibana:5601/kbn}
      # In-app ELK power toggle (Log Ingest tab): the backend reaches the scoped
      # docker_socket_proxy over TCP to start/stop the ES+Kibana containers and
      # free their RAM when idle. Auto-enabled when this points at a reachable
      # proxy; set empty to hide the toggle (falls back to a manual command).
      - DOCKER_API_URL=${DOCKER_API_URL:-http://docker_socket_proxy:2375}
      # Idle auto-shutdown for the RAM-heavy ELK + Sandbox containers: they boot
      # with the stack and stop themselves after this many idle minutes, then
      # auto-start when an analyst opens the page (needs the docker proxy above).
      # Set IDLE_POWER_ENABLED=false to keep them always-on.
      - IDLE_POWER_ENABLED=${IDLE_POWER_ENABLED:-true}
      - ELK_IDLE_TIMEOUT_MIN=${ELK_IDLE_TIMEOUT_MIN:-3}
      - SANDBOX_IDLE_TIMEOUT_MIN=${SANDBOX_IDLE_TIMEOUT_MIN:-3}
      # OOB interaction server ("Catch"). Disabled unless OOB_ENABLED=true AND the
      # OOB_DOMAIN zone is delegated to OOB_PUBLIC_IP. See .env.example for setup.
      - OOB_ENABLED=${OOB_ENABLED:-false}
      - OOB_DOMAIN=${OOB_DOMAIN:-}
      - OOB_PUBLIC_IP=${OOB_PUBLIC_IP:-}
      - OOB_PUBLIC_IPV6=${OOB_PUBLIC_IPV6:-}
      - OOB_NS_NAME=${OOB_NS_NAME:-}
      - OOB_TLS_CERT=${OOB_TLS_CERT:-}
      - OOB_TLS_KEY=${OOB_TLS_KEY:-}
    volumes:
      - storage_data:/app/storage
      - ./backend/data:/app/data
      # NOTE: the backend does NOT mount the docker socket. The ELK power toggle
      # goes through the scoped docker_socket_proxy service (least privilege).
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tor:
        condition: service_started
      docker_socket_proxy:
        condition: service_started
      # NOTE: intentionally no depends_on for elasticsearch/kibana — the backend
      # starts immediately (it tolerates ELK being down/stopped) instead of waiting
      # ~1 min for Elasticsearch to become healthy.
    restart: unless-stopped

  # Volatility + Kali offensive sandbox. The ttyd web terminal is intentionally
  # NOT published on the host — the backend reverse-proxies to it on the internal
  # network (volatility_sandbox:7681) behind an admin JWT, so there is no
  # unauthenticated shell exposed. Tool egress is routed through the `tor`
  # service (see the Dockerfile) to avoid leaking the host IP during scans.
  volatility_sandbox:
    build:
      context: ./volatility
      dockerfile: Dockerfile
    container_name: analysishub_volatility
    # Runs on `docker compose up`. An admin can STOP it from the Sandbox Analysis
    # page (via the scoped docker proxy) to free RAM when idle, and Start it again.
    # No host port mapping — reachable only via the backend sandbox proxy.
    expose:
      - "7681"
    volumes:
      - storage_data:/app/storage
    # privileged dropped — volatility only reads dump files. If raw-packet
    # tooling is ever needed locally, add `cap_add: [NET_RAW, NET_ADMIN]`
    # instead of full privilege (Tor scans use connect scans, no raw caps).
    depends_on:
      tor:
        condition: service_started
    restart: unless-stopped

  # Local malware EMULATION sandbox (Mandiant speakeasy). Provides dynamic
  # behaviour analysis WITHOUT a VM or an external CAPE appliance: it emulates the
  # sample's CPU + Win32 API calls (nothing is really executed), so it is safe and
  # fully local. The backend reverse-calls it on the internal network; no host
  # port is published. Stateless — restarting it loses nothing.
  malware_emulator:
    build:
      # Repo root so the Dockerfile can also COPY the bundled YARA ruleset (tools/).
      context: .
      dockerfile: emulator/Dockerfile
    container_name: analysishub_malware_emulator
    expose:
      - "8091"
    # No network egress needed — emulation is entirely local. (Docker has no
    # per-service "disable network" here without a custom network; the service
    # simply never makes outbound calls.)
    restart: unless-stopped

  # Network-traffic analysis sidecar (Suricata, offline pcap mode). The backend
  # POSTs an uploaded .pcap; Suricata reads the FILE (no live capture, no raw
  # caps) and returns flows/DNS/TLS-JA3/HTTP + ET-Open C2 alerts distilled to JSON.
  # No host port; reached at NET_ANALYZER_URL. Stateless.
  net_analyzer:
    build:
      context: .
      dockerfile: net-analyzer/Dockerfile
    container_name: analysishub_net_analyzer
    expose:
      - "8092"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: analysishub_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    # NOTE: no depends_on for kibana — nginx resolves it at request time (see the
    # /kbn location), so the frontend stays up even while an admin has ELK stopped.
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  elasticsearch_data:
