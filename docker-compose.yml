services:
  postgres:
    image: postgres:16-alpine
    container_name: forensichub_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forensichub}
      POSTGRES_USER: ${POSTGRES_USER:-forensic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensic_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensic}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forensichub_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: forensichub_backend
    environment:
      - APP_ENV=${APP_ENV:-development}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - POSTGRES_DSN=postgres://${POSTGRES_USER:-forensic}:${POSTGRES_PASSWORD:-forensic_secret}@postgres:5432/${POSTGRES_DB:-forensichub}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - JWT_SECRET=${JWT_SECRET:-change_this_jwt_secret_in_production}
      - STORAGE_PATH=/app/storage
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@forensichub.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - USE_HTTPS=${USE_HTTPS:-false}
      - WPSCAN_API_TOKEN=${WPSCAN_API_TOKEN:-cPjhzW2Jq6NeHD9MMLLesLSfbrvzZbmQOUHEcEjYLsM}
      - WPSCAN_API_TOKEN_2=${WPSCAN_API_TOKEN_2:-md9YXsKj1b0L4KlwelaFqpPE5YT5qxgz53KeD3PoAiM}
      - LOG_PATH=/app/data/logs
    volumes:
      - storage_data:/app/storage
      - ./backend/data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: forensichub_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
