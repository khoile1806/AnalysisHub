# Preserve the upstream reverse-proxy's X-Forwarded-Proto if it sent one,
# else fall back to the connection scheme on this hop. Needed so the Go
# backend's getServerURL() returns https:// when the page was served
# over TLS by an outer proxy (Caddy / nginx / Cloudflare).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 80;
    server_name _;
    # No hard limit — let the backend control max upload size.
    # Memory dumps, disk images, and similar forensic artifacts routinely
    # exceed 1–4 GB; restricting at the proxy layer causes a 413 before the
    # request even reaches Go.
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — applied to every response (add_header inherits into
    # nested locations only if they define no add_header of their own, so these
    # are repeated where a location adds its own headers).
    # DFIR data (log lines, filenames, tool output) is untrusted; a strict CSP
    # plus nosniff/frame-deny/referrer limits the blast radius of any injected
    # content. 'unsafe-inline' is required by the Vite/React runtime styles.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # img-src allows https: so OSINT avatars / favicons / remote thumbnails still
    # render; everything executable stays restricted to 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sandbox terminal (volatility/kali ttyd) — the backend reverse-proxies to it.
    # ttyd uses a WebSocket at /api/v1/sandbox/terminal/ws, so this MUST carry the
    # Upgrade/Connection headers (the generic /api/ location does not). Longest-
    # prefix match means this wins over /api/ for these URLs.
    location /api/v1/sandbox/terminal/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # API proxy (when running behind the same nginx)
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host preserves the port (e.g. "192.168.100.94:3000") so the
        # Go backend's getServerURL() builds install scripts with the correct
        # port. $host alone strips it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        # Do not buffer the request body in nginx temp files — stream it
        # directly to the backend. Required for multi-GB file uploads so
        # nginx does not OOM or hit its own temp-file quota first.
        proxy_request_buffering off;
        # Allow streaming responses (file downloads from agent, SSE streams)
        # to reach the client immediately instead of buffering the entire
        # upstream response in nginx temp files first.
        proxy_buffering off;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        # $http_host preserves the port (e.g. "192.168.100.94:3000") so the
        # Go backend's getServerURL() builds install scripts with the correct
        # port. $host alone strips it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 86400s;
    }

    # Catch (OOB HTTP receiver) — public endpoint hit by target callbacks
    location /catch/ {
        proxy_pass http://backend:8080;
        # $http_host preserves the port (e.g. "192.168.100.94:3000") so the
        # Go backend's getServerURL() builds install scripts with the correct
        # port. $host alone strips it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Canary tokens (OSINT) — public tracking links hit by anyone who clicks
    # them. Must reach the backend so it can record the visitor and 302-redirect;
    # without this, /c/<slug> would fall through to the SPA and never redirect.
    # X-Forwarded-For carries the real client IP so the hit log is accurate.
    location /c/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # OOB "Catch" webhook receiver — public endpoint hit by target callbacks at
    # /oob/r/<token>. Must reach the backend (any HTTP method) so the callback is
    # captured; without this it would fall through to the SPA. X-Forwarded-For
    # carries the real source IP for the interaction log.
    location /oob/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Kibana — full ELK UI, reverse-proxied same-origin under /kbn so it is
    # centralised in the app and can be embedded in the in-app "Kibana" page.
    # Kibana runs with server.basePath=/kbn + rewriteBasePath, so the /kbn prefix
    # is passed through untouched. We override the server-level X-Frame-Options
    # DENY with SAMEORIGIN here (a location with its own add_header does NOT
    # inherit the server ones) so the same-origin iframe is allowed to render;
    # the app's CSP frame-src falls back to default-src 'self', which permits it.
    # ^~ makes this prefix win over the static-asset regex location above, so
    # Kibana's own /kbn/*.js|*.css bundles are proxied to Kibana instead of being
    # looked up on disk (which 404s and leaves Kibana blank).
    location = /kbn { return 302 /kbn/; }
    location ^~ /kbn/ {
        proxy_pass http://kibana:5601;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # React Router fallback — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
