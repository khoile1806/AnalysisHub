# Curated credential-access rules for AnalysisHub.
# Written against the fields the agent actually collects from Windows EVTX:
# Security 4688 (NewProcessName / ProcessCommandLine / ParentProcessName) and
# Sysmon 1 (Image / CommandLine / ParentImage). The engine aliases the two
# namespaces, so the Sysmon field names below work on both.
#
# NOTE: CommandLine-based rules need "Include command line in process creation
# events" enabled (Audit Process Creation policy); Image-only rules do not.
title: Credential Dumping Tool Execution
id: ah-cred-0001
status: stable
description: Detects known credential-dumping tools by image name or by mimikatz command syntax.
author: AnalysisHub
level: critical
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '\mimikatz.exe'
            - '\safetykatz.exe'
            - '\nanodump.exe'
            - '\wce.exe'
            - '\gsecdump.exe'
            - '\pwdump.exe'
            - '\lazagne.exe'
            - '\secretsdump.py'
    selection_syntax:
        CommandLine|contains:
            - 'sekurlsa::'
            - 'lsadump::'
            - 'kerberos::golden'
            - 'privilege::debug'
            - 'Invoke-Mimikatz'
            - 'Get-GPPPassword'
    condition: 1 of selection_*
falsepositives:
    - Authorised red-team exercises or password-audit tooling
---
title: LSASS Memory Dump via Legitimate Utility
id: ah-cred-0002
status: stable
description: >-
    Detects LSASS being dumped through signed utilities (procdump, comsvcs.dll
    MiniDump, taskmgr-style rundll32). Requires the process to explicitly target
    lsass, which is what separates this from normal admin use of the same tools.
author: AnalysisHub
level: critical
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_procdump:
        Image|endswith:
            - '\procdump.exe'
            - '\procdump64.exe'
        CommandLine|contains: 'lsass'
    selection_comsvcs:
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
    selection_createdump:
        Image|endswith: '\createdump.exe'
        CommandLine|contains: 'lsass'
    condition: 1 of selection_*
falsepositives:
    - Deliberate crash-dump collection by support staff
---
title: Registry Hive Dump for Offline Credential Extraction
id: ah-cred-0003
status: stable
description: Detects reg.exe saving the SAM, SECURITY or SYSTEM hive, the offline path to local hashes.
author: AnalysisHub
level: high
tags:
    - attack.credential_access
    - attack.t1003.002
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\reg.exe'
        CommandLine|contains: ' save '
    selection_hive:
        CommandLine|contains:
            - 'hklm\sam'
            - 'hklm\security'
            - 'hklm\system'
    condition: selection and selection_hive
falsepositives:
    - Backup or migration scripts exporting hives deliberately
---
title: DCSync-Style Directory Replication Request
id: ah-cred-0004
status: experimental
description: >-
    Detects the replication rights used by DCSync being exercised by a non-DC
    account. Only fires when the replication GUIDs appear in the event, which
    normal user activity never contains.
author: AnalysisHub
level: high
tags:
    - attack.credential_access
    - attack.t1003.006
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: '4662'
    selection_guid:
        Properties|contains:
            - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
            - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
            - '89e95b76-444d-4c62-991a-0facbeda640c'
    filter_machine:
        SubjectUserName|endswith: '$'
    condition: selection and selection_guid and not filter_machine
falsepositives:
    - Azure AD Connect or another directory-sync service running as a user account
