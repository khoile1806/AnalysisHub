[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-release-watch"
version = "0.1.0"
description = "Watch WordPress plugin releases and flag security fixes for follow-up analysis"
requires-python = ">=3.11"
authors = [{name = "AnalysisHub"}]
license = {text = "MIT"}
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
plugin-release-watch = "watcher.cli:main"

[tool.setuptools]
packages = ["watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
