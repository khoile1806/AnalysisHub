[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yara-scanner"
version = "0.1.0"
description = "Multi-engine webshell scanner (YARA + pattern + heuristic) for DFIR"
requires-python = ">=3.11"
authors = [{name = "ForensicHub"}]
license = {text = "MIT"}
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "yara-python>=4.5",
  "python-magic-bin>=0.4.14; sys_platform == 'win32'",
  "python-magic>=0.4.27; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyinstaller>=6.5",
]

[project.scripts]
yara-scanner = "scanner.cli:app"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.setuptools.package-data]
scanner = ["../rules/**/*", "../templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
